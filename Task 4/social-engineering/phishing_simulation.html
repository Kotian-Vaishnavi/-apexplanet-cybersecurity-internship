<!DOCTYPE html>
<html>
<head>
    <title>Login Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 80px;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 10px;
            width: 95%;
            cursor: pointer;
        }

        .warning {
            color: red;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Company Login Portal</h2>

    <form>
        <input type="text" placeholder="Enter Username" required><br>
        <input type="password" placeholder="Enter Password" required><br>
        <button type="submit">Login</button>
    </form>

    <div class="warning">
        ⚠ This is a phishing awareness simulation page.<br>
        Never enter credentials on suspicious websites.
    </div>
</div>

</body>
</html>
